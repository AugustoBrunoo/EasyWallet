<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EasyWallet</title>

    <link rel="shortcut icon" href="../../assets/logo-site/logo-iniciais.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../../styles/styleGlobal.css">
    <link rel="stylesheet" href="./login.css">

</head>

<body>
    <header class="header">
        <div class="container nav-container" style="justify-content: center;">
            <a href="../../index.html" class="logo">
                <img src="../../assets/logo-site/logo-carteira2.png" alt="Logo EasyWallet">
                <p class="nome-logo">EasyWallet</p>
            </a>
        </div>
    </header>

    <main>
        <section class="login-section">
            <div class="login-box">
                <h2>Faça seu login</h2>

                <form id="login-form">
                    <div class="input-group">
                        <label for="email">Email Institucional</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@edu.unirio.br" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="********" required>
                    </div>

                    <div class="form-options">
                        <div class="checkbox-group">
                            <input type="checkbox" id="show-password">
                            <label for="show-password">Mostrar senha</label>
                        </div>
                        <a href="#" class="forgot-password">Esqueceu sua senha?</a>
                    </div>

                    <a href="../perfilLogado/perfilLogado.html" class="btn-login-submit">Entrar</a>
                </form>

                <div class="signup-prompt">
                    <p>Você ainda não é cadastrado?</p>
                    <a href="../Cadastro/cadastro.html">Crie sua conta agora mesmo!</a>
                    <p class="signup-subtext">Organize sua vida financeira com a gente!</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-links">
                <a href="../../pages/SobreNos/sobreNos.html">Sobre Nós</a>
                <a href="../Contato/contato.html">Contato</a>
                <a href="../emConstrucao/emConstrucao.html">Privacidade</a>
            </div>
            <div class="footer-social">
                <a href="https://github.com/AugustoBrunoo/EasyWallet" aria-label="GitHub"><i class="bi bi-github"></i></a>
                <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                <a href="#" aria-label="Discord"><i class="bi bi-discord"></i></a>
            </div>
            <div class="footer-copy">
                Copyright @ EasyWallet 2025
            </div>
        </div>
    </footer>

    <script src="./login.js"></script>
</body>

</html>
